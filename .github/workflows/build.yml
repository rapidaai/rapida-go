name: Build and Publish Golang SDK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: go mod tidy

      - name: Verify go.mod
        run: |
          echo "Module name from go.mod:"
          head -1 go.mod

      - name: Build the SDK
        run: go build -v ./...

      - name: Test the SDK
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
        if: always()

  publish:
    name: Create Release and Publish Go Module
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper tagging

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: go mod tidy

      - name: Get version and create tag
        id: version
        run: |
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt)
          else
            # Alternative: generate version from date/commit
            VERSION="0.1.$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_OUTPUT

          # Check if tag already exists
          if git tag -l "v${VERSION}" | grep -q "v${VERSION}"; then
            echo "Tag v${VERSION} already exists, skipping tag creation"
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.version.outputs.TAG_EXISTS == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG_NAME }}" -m "Release ${{ steps.version.outputs.TAG_NAME }}"
          git push origin "${{ steps.version.outputs.TAG_NAME }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download artifacts for release
          mkdir -p release-assets

          # Create release notes
          echo "# Release ${{ steps.version.outputs.TAG_NAME }}" > release-notes.md
          echo "" >> release-notes.md
          echo "## Changes" >> release-notes.md
          echo "- Automated release from commit $(git rev-parse --short HEAD)" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Installation" >> release-notes.md
          echo "\`\`\`bash" >> release-notes.md
          echo "go get github.com/rapidaai/rapida-go@${{ steps.version.outputs.TAG_NAME }}" >> release-notes.md
          echo "\`\`\`" >> release-notes.md

          gh release create "${{ steps.version.outputs.TAG_NAME }}" \
            --title "Release ${{ steps.version.outputs.TAG_NAME }}" \
            --notes-file release-notes.md

      - name: Verify Go Module Publication
        run: |
          echo "Waiting for Go module proxy to index the new version..."
          sleep 30

          # The Go module proxy automatically indexes public GitHub repos
          # We just need to verify it's available
          MAX_ATTEMPTS=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT: Checking module availability..."
            
            if go list -m github.com/rapidaai/rapida-go@${{ steps.version.outputs.TAG_NAME }} > /dev/null 2>&1; then
              echo "✅ Module is available at github.com/rapidaai/rapida-go@${{ steps.version.outputs.TAG_NAME }}"
              break
            else
              echo "⏳ Module not yet available, waiting..."
              sleep 30
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "⚠️  Module may take longer to be available on the Go module proxy"
            echo "This is normal and the module should be available shortly"
          fi
