name: Build and Publish Golang SDK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: go mod tidy

      - name: Build the SDK
        run: go build -v ./rapida/...

      - name: Test the SDK
        run: go test -v -coverprofile=coverage.out ./rapida/...

      - name: Generate Documentation
        run: |
          go install golang.org/x/tools/cmd/godoc@latest
          godoc -http=:6060 &
          sleep 5
          wget -r -np -N -E -p -k http://localhost:6060/pkg/github.com/rapidaai/rapida-go/
          mkdir -p docs
          mv localhost:6060/* docs/
          kill %1

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: sdk-documentation
          path: docs

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  publish:
    name: Publish Go Module and Documentation
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: go mod tidy

      - name: Tag the release
        id: tag
        run: |
          VERSION=$(cat version.txt)
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a "v${VERSION}" -m "Release version ${VERSION}"
          git push origin "v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.tag.outputs.VERSION }}" --title "Release ${{ steps.tag.outputs.VERSION }}" --notes "Release notes for version ${{ steps.tag.outputs.VERSION }}"

      - name: Configure Go Module Proxy
        run: go env -w GOPROXY=https://proxy.golang.org,direct

      - name: Publish to Go Module Proxy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOPROXY="https://proxy.golang.org,direct" go list -m github.com/rapidaai/rapida-go@v${{ steps.tag.outputs.VERSION }}

      - name: Verify Module Availability
        run: go mod download github.com/rapidaai/rapida-go@v${{ steps.tag.outputs.VERSION }}

      - name: Download Documentation
        uses: actions/download-artifact@v4
        with:
          name: sdk-documentation
          path: docs

      - name: Publish Documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Update documentation for version ${{ steps.tag.outputs.VERSION }}"
