name: Build and Publish Golang SDK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: go mod tidy

      - name: Build the SDK
        run: go build -v ./rapida/...

      - name: Test the SDK
        run: go test -v -coverprofile=coverage.out ./rapida/...

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: sdk-documentation
          path: docs

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  publish:
    name: Publish Go Module and Documentation
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: go mod tidy

      - name: Tag and push new version
        id: tag_version
        run: |
          VERSION=$(cat version.txt)
          if [ -z "$VERSION" ]; then
            echo "Error: version.txt is empty or doesn't exist"
            exit 1
          fi
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.tag_version.outputs.VERSION }}" --title "Release Go SDK v${{ steps.tag_version.outputs.VERSION }}" --notes "Release notes for version ${{ steps.tag_version.outputs.VERSION }}"

      - name: Verify module availability
        run: |
          go list -m github.com/rapidaai/rapida-go@v${{ steps.tag_version.outputs.VERSION }}

      - name: Download Documentation
        uses: actions/download-artifact@v4
        with:
          name: sdk-documentation
          path: docs

      - name: Publish Documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Update documentation for version ${{ steps.tag_version.outputs.VERSION }}"
          force_orphan: true

      - name: Verify GitHub Pages Deployment
        run: |
          echo "Verifying GitHub Pages deployment..."
          sleep 60  # Wait for GitHub Pages to update
          curl -s -o /dev/null -w "%{http_code}" https://rapidaai.github.io/rapida-go/ | grep 200 || exit 1
